name: prepare-release-artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0 setuptools==82.0.1
      - name: Deterministic wheel timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python -m build
      - run: python scripts/audit_release.py dist/*
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: package-candidate
          path: dist/*
    # Intentionally no registry publication, releases:write or trusted-publisher permissions.
